name: Pull request checks
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_pages_site.py tests/test_ranking_export.py tests/test_pages_publish.py -p no:cacheprovider
        env:
          PYTHONPATH: src
      - run: node --test tests/all-books-worker.test.cjs
