name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run site and export tests
        env:
          PYTHONPATH: src
        run: |
          pytest tests/test_pages_site.py tests/test_ranking_export.py -p no:cacheprovider
      - name: Prepare site artifacts
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          [ -d data ] && cp -r data _site/ || true
          [ -f .nojekyll ] && cp .nojekyll _site/ || touch _site/.nojekyll
          [ -f favicon.ico ] && cp favicon.ico _site/ || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
