[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "douban-books-crawler"
version = "1.0.0"
description = "从豆瓣 Top 250、标签、豆列和丛书列表页采集书籍公开信息并排序"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
douban-books = "douban_books.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/douban_books"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
